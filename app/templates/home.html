<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            background-color: #EFEBDF;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .container{
            margin: 30px auto 40px;
            text-align: center;
        }

        .container .logo{
            width: 300px;
            max-width: 80%;
        }

        section{
            display: inline-block;
            padding: 12px 20px;
            margin: 20px auto;
            background-color: #7f8985;
            font-size: 20px;
            border-radius: 8px;
        }

        .buttons{
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 32px;
            margin-bottom: 40px;
        }

        .btn{
            background-color: #7f8985;
            width: 200px;
            height: 200px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;

            font-size: 26px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;

            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover{
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        a{
            text-decoration: none;
            color: black;
        }

        .btn .icon{
            width: 80px;
        }

        .btn .icon2{
            width: 72px;
        }
    </style>
</head>
<body>
    <main>
        <!-- <section><a href="menu.html"><b>Menu</b></a></section> -->
    <div class="container">
        <img src="{{url_for('static', filename='images/newlogo.png')}}">
    </div>
    <div class="buttons">
        <form action="{{ url_for('menu.set_order_type') }}" method="POST">
            <input type="hidden" name="order_type" value="delivery">
            <button class="btn" type="submit">
                <img src="{{ url_for('static', filename='images/delivery-truck.png')}}" alt="" class="icon">
                <b>Delivery</b></a>
            </button>
        </form>

        <form action="{{ url_for('menu.set_order_type') }}" method="POST">
        <input type="hidden" name="order_type" value="pickup">
            <button class="btn" type="submit">
                <img src="{{ url_for('static', filename='images/shopping-bag.png')}}" alt="" class="icon2">
                <b>Pick Up</b></a>
            </button>
        </form>
    </div></main>
    <script>
        console.log("HOME PAGE: clearing cart...")
        localStorage.removeItem("cart");
    </script>
</body>
</html>
