<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{  order_type  }}
    </title>
    <style>
        body{
            background-color: #EFEBDF;
            display: flex;
            justify-content: center;
            padding:40px 40px;
            /* border: 2px solid red; */
            font-family: Georgia;
            
        }
        form{
            /* border: 2px solid black; */
            
            padding: 40px;
        }
        label{
            display: block;
            margin-bottom: 10px;
        }
        input{
            margin-bottom: 10px;
            padding: 5px 20px;
            border-radius: 5px;
            box-shadow: none;
        }
        button{
            margin-left: 70px;
            margin-right: 70px;;
            margin-top: 20px;
            width: 80px;
            height: 60px;
            font-size: 20px;
            background-color: #7f8985;  
        }
    </style>
</head>
<body>
    <div>
        <form action="{{url_for('order_bp.personal_info')}}" method = "POST">
            <input type="hidden" name="order_type" value="{{ order_type }}" id="">
            <!-- common information -->
            <div>
                <label>Name:</label>
                <input type="text" name="customer_name" required placeholder="Customer Name">
            </div>
            <div>
                <label>Handphone No.:</label>
                <input type="text" name="customer_phone" required>

                <label for="">Postal code</label>
                <input type="text" id="postal_code" name="postal_code" maxlength="6" required>
                <div id ="postal-feedback"></div>

            </div>
            <!-- This field is for delivery only -->
            {% if order_type == "delivery" %}
            <div id="deliveryField">

                <label for=""> Delivery Address</label>
                <input type="text" name="address" required>

                <label for="">Special Instructions</label>
                <input type="text" name="instructions">
            </div>
            {% endif %}
            <!-- Over here would be information needed for pick up orders -->
            {% if order_type == "pickup" %}
            <div id="pickupField">

                <label>Pickup Outlet</label>
                <select id="outlet_select" name="outlet_id" required>
                    {% for outlet in outlets %}
                        <option value="{{ outlet.id }}">{{ outlet.name }}</option>
                    {% endfor %}
                </select>

                <div class="form-group">
                    <label for="pickup_time"><b>Pick-up Time</b></label>
                    <select name="pickup_time" id="pickup_time" required>
                        <option value="">Select a time</option>
                        <option value="ASAP">ASAP (15–20 mins)</option>
                        <option value="12:00">12:00 PM</option>
                        <option value="12:30">12:30 PM</option>
                        <option value="13:00">1:00 PM</option>
                        <option value="13:30">1:30 PM</option>
                        <option value="18:00">6:00 PM</option>
                        <option value="18:30">6:30 PM</option>
                        <option value="19:00">7:00 PM</option>
                    </select>
                </div>

            </div>
            {% endif %}
            <button type="submit">Enter</button>
        </form>
    </div>
    <script>

        console.log("Postal JS loaded")
        const postalInput = document.getElementById("postal_code");
        const feedback = document.getElementById("postal-feedback");
        const outletSelect = document.getElementById("outlet_select");

        if (postalInput && feedback){
            postalInput.addEventListener("input", async()=>{
                const postal= postalInput.value.trim();

                if (postal.length <6){
                    feedback.innerHTML = "<em> Enter 6 Digit postal code </em>";
                    return;
                }
                try {
                    const res = await fetch(`/api/postal/suggest?postal=${postal}`);
                    const data = await res.json();
                    if (!data.ok){
                        feedback.innerHTML = `<span style="color:red">${data.message}</span>`;
                        return;
                    }

                feedback.innerHTML = `
                <p>
                    Delivery Zone: <strong>${data.zone}</strong>
                </p>
                `;
                if (outletSelect && Array.isArray(data.outlets)){
                    outletSelect.innerHTML = `<option value = ""> Select outlet</option>`;
                    data.outlets.forEach((o,index)=> {
                        const opt = document.createElement("option");
                        opt.value = o.id; opt.textContent = o.name;
                    if (index ===0) opt.selected = true;
                    outletSelect.appendChild(opt);
                });

                }
                } catch (err){
                    feedback.innerHTML= `<span style="color:red">Unable to validate postal code </span>`;
                }
            });
        }
    </script>
</body>
</html>
