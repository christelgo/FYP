    <script>
        // js for ala carte
        document.addEventListener("DOMContentLoaded", () =>{

            const sections= document.querySelectorAll("section");
            const navItems = document.querySelectorAll(".ala_carte_categories li");

            const observer = new IntersectionObserver((entries) =>{
                entries.forEach(entry => {

                    if (entry.isIntersecting){

                        const id = entry.target.id;

                        navItems.forEach(li => li.classList.remove("active"));

                        const matching = document.querySelector('.ala_carte_categories li.${id}');

                        if (matching){
                            matching.classList.add("active");
                        }
                    }
                });
            },{
                threshold:0.4
            });
            sections.forEach(sec => observer.observe(sec));
        });
        document.querySelectorAll(".ala_carte_categories li").forEach(li =>{
            li.addEventListener("click",() =>{
                const id= li.className;
                const section = document.getElementById(id);

                const container = document.querySelector(".category-scroll");
                container.scrollTo({
                    left: section.offsetleft,
                    behavior:"smooth"
                });
            });
        });
        document.addEventListener("DOMContentLoaded", ()=>{
            const bentosections = document.querySelectorAll(".bento_sets    .scroll-section");
            const bentoTabs = document.querySelectorAll(".bento_set_categories li");
            const bentocontainer = document.querySelector(".bento_sets  .category-scroll");

            const bentoObserver = new IntersectionObserver((entries)=>{
                entries.forEach(entry =>{
                    if (entry.isIntersecting) {
                        const id = entry.target.id;

                        bentoTabs.forEach(li => li.classList.remove("active"));
                        const match = document.querySelector('.bento_set_categories li.${id}');
                        if (match) match.classList.add(active);
                    }
                });
            },{
                threshold: 0.5
            });
            bentoTabs.forEach(li => {
                li.addEventListener("click",() =>{
                    const id = li.className;
                    const section = document.getElementById(id);

                    bentocontainer.scrollTo({
                        left: section.offsetLeft,
                        behavior:"smooth"
                    });
                });
            });
        })
    </script>
