<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNow!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #EFEBDF;
            color: #333;
        }

        /* ===== Container ===== */
        .payment-container {
            max-width: 420px;
            margin: 60px auto;
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        /* ===== Headings ===== */
        .payment-container h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 22px;
        }

        /* ===== Order Info ===== */
        .order-info {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* ===== PayNow QR Placeholder ===== */
        .qr-placeholder {
            width: 250px;
            height: 250px;
            margin: 0 auto 20px;
            background: #f5f5f5;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #777;
        }

        /* ===== Upload Section ===== */
        .upload-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .file-input {
            width: 100%;
            margin-bottom: 14px;
        }

        /* ===== Image Preview ===== */
        .image-preview {
            display: none;
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        /* ===== Submit Button ===== */
        .submit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #000;
        }
    </style>

</head>
<body>
    <div class="payment-container">
    <h2>Pay with PayNow</h2>

    <div class="order-info">
        Order ID: {{ order.id }}
    </div>

    <div class="amount">
        Amount to Pay: ${{ "%.2f" | format(order.final_total) }}
    </div>

    <!-- PayNow QR Placeholder -->
    <div class="qr-placeholder">
        PayNow QR Code Here
    </div>

    <form method="POST"
          action="{{ url_for('payment.upload_payment', order_id=order.id) }}"
          enctype="multipart/form-data">

        <label class="upload-label">Upload PayNow Screenshot</label>

        <input type="file"
               name="paynow_screenshot"
               accept="image/*"
               onchange="previewImage(event)"
               required
               class="file-input">

        <img id="image-preview" class="image-preview">

        <button type="submit" class="submit-btn">
            Submit Payment
        </button>
    </form>
</div>

<script>
function previewImage(event) {
    const img = document.getElementById("image-preview");
    const file = event.target.files[0];

    if (!file) return;

    img.src = URL.createObjectURL(file);
    img.style.display = "block";
}
</script>

</body>
</html>
