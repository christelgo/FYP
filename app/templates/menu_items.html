<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.1</title>
    <style>
        body{
            background-color: #EFEBDF;
        }
        .shopping-cart{
            background: none;
        }
        .shopping-cart icon{
            justify-content: right;
            padding: 30px;
            border: 1px solid red;
        }
        .shopping-cart img{
            width: 50px;
            height: 50px;
            object-fit: fill;
        }
        
        ul{
            list-style: none;
            border: 1px solid black;
            display: flex;
        }
        .top-nav{
            border: 1px solid brown;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px;
        }
         li{
            padding: 20px;
            border: 1px solid black;
            margin-right:10px;
         }
        .cat{
            font-size: 24px;
            background: none;
            cursor: pointer;
        }
        .menu-grid{
            border: 1px solid black;
            display: grid;
            grid-template-columns: repeat(2,480px);
            gap: 15px;
            justify-content: center;
            overflow: hidden;
            padding-left: 20px;
            padding-right: 20px;
        }
        .menu-item{
            border: 3px solid salmon;
            padding: 10px;
            overflow: hidden;
        }
        .item-image{
            border: 1px solid maroon;
            box-sizing: border-box;
            width: 100%;
            height: 300px;
            text-align: center;

            
        }
        .item-quantity{
            border: 1px solid darkblue;
            display: flex;
            justify-content: center;
        }
        .qty-value{
            border: 1px solid ;
           background-color: whitesmoke;
            padding: 12px 20px;
        }
        .button{
            margin: 20px;
        }
        .qty-btn{
            padding: 12px 20px;
            font-size: 20px;
            border: none;
            cursor: pointer;
        }
        .top-nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #EFEBDF;
            border-bottom: 2px solid #ccc;
        }
        .cat{
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-links{
            display: none !important;
            flex-direction: row;
            gap: 15px;
            margin-top: 10px;
        }
        .show{
            display: flex !important;
        }
        .back-btn{
            margin-top: 24px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

    </style>
</head>
<body>    
    
    <nav class="top-nav">
        <!-- // click this: the different categories would pop up -->
        <button class="cat" onclick="ToggleNav()">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="#chicken">Chicken</a></li>
            <li><a href="#pork">Pork</a></li>
            <li><a href="#veg">Vegetarian</a></li>
            <li><a href="#others">Others</a></li>
        </ul>
        <button class="shopping-cart"><img src="C:/Users/chris/OneDrive/Desktop/FYP/app/static/images/shopping-bag.png" alt="" class="icon"></button>
    </nav>

    <div class="menu-grid">
        {% for item in items %}
        <div class="menu-item"
        data-id = "{{menu_type}}-{{category}}-{{loop.index}}">
            <div class="item-image">image</div>
            <div class="item-quantity">
                <button class="qty-btn minus">-</button>
                <span class="qty-value">0</span>
                <button class="qty-btn add">+</button>
            </div>
        </div>        
        {% endfor %}
        </div>
        
    </div>
    <div><button class="back-btn">back</button></div>

    <script>
        // add and subtract button for all
        document.addEventListener("DOMContentLoaded", function (){
            const menuItems = document.querySelectorAll(".menu-item");
            
            menuItems.forEach(item => {
                const minusBtn = item.querySelector(".minus");
                const addBtn = item.querySelector(".add");
                const qtyValue = item.querySelector(".qty-value");

            let quantity= 0;


            addBtn.addEventListener("click", function() {
                quantity++;
                qtyValue.textContent = quantity;});

            minusBtn.addEventListener("click", function() {
                if (quantity>0){
                    quantity--;
                    qtyValue.textContent=quantity;} });
        });
    });
        function ToggleNav(){
            document.getElementById("navLinks").classList.toggle("show");
        }
    </script>
</body>
</html>
